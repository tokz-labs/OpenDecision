[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opendecision"
version = "0.1.0"
description = "Open encoder models for fast decisions over runtime-defined options."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Abdallah Alwarawreh", email = "abood@tokz.dev" }]
keywords = ["text classification", "zero-shot classification", "intent detection", "routing", "deberta", "cross-encoder"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "transformers>=4.48",
    "tokenizers>=0.19",
    "huggingface_hub>=0.23",
    "safetensors>=0.4",
    "sentencepiece>=0.1.99",
    "numpy>=1.26",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
eval = ["datasets>=2.19"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
opendecision-train = "opendecision.cli.train:main"
opendecision-evaluate = "opendecision.cli.evaluate:main"

[project.urls]
Homepage = "https://github.com/tokz-labs/OpenDecision"
Models = "https://huggingface.co/Tokz-labs"
Issues = "https://github.com/tokz-labs/OpenDecision/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
